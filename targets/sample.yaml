# Sample target list for the demo. Each entry is one company; the agent will
# create one personalized draft email per entry.
#
# In production you'd pipe this in from HubSpot, Apollo, your sales engineer
# spreadsheet, or wherever your target lists live. Schema is intentionally
# minimal so any source can be normalized to it in <20 lines.

targets:
  - company: Halberd Health
    domain: halberdhealth.example.com
    contact_name: Dana Reyes
    contact_email: ciso@halberdhealth.example.com
    contact_role: CISO
    industry: healthtech
    public_signals:
      - "Series B announced 6 weeks ago ($42M)"
      - "3 open security engineering roles posted in the last 30 days"
      - "Public breach disclosure 14 months ago — credentials in S3"
    pain_hypothesis: scaling SOC capacity faster than they can hire

